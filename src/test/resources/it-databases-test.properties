# Test environment of the integration tests: the database servers of 192.168.0.63 (the default).
# The local environment is it-databases-local.properties: mvn verify -Dit.env=local
# A system property of the same name overrides a key, e.g. mvn verify -Doracle.port=1521
# H2, SQLite and DuckDB are files in target/it-data. A database without settings or unreachable is skipped.
#
# Keys per database:
#   host, port, username, password  the server
#   database                        database of the url (service name of Oracle), a catalog replaces it
#   sourceCatalog, sourceSchema      where the fixture tables are created
#   targetCatalog, targetSchema      where imports go

