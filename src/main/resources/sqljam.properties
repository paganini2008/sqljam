# SqlJam configuration
# This file is placed next to the runnable jar (bin/sqljam.properties) and is not packaged into the jar.
# Edit it and restart. conf/sqljam.properties next to the jar or -Dsqljam.app.config=/path also work.
# Settings changed in the UI are saved in ${user.home}/.sqljam/sqljam.properties (or -Dsqljam.config=/path)
# and override this file.

# Directory of application data (connections, logs)
sqljam.home=${user.home}/.sqljam
sqljam.connections.file=${sqljam.home}/connections.json

# Banner printed at startup: console, log or off. A custom banner file can be set by sqljam.banner.location
sqljam.banner.mode=console
sqljam.banner.location=

# Splash screen with the logo while starting, shown at least min-duration milliseconds so that it does not flash
sqljam.splash.enabled=true
sqljam.splash.min-duration=1200

# User interface
sqljam.ui.theme=Primer Dark
sqljam.ui.window.width=1280
sqljam.ui.window.height=800
# Rows per page of the data viewer
sqljam.ui.data.page-size=200

# Export and import
# Rows read per page. Measured best: throughput levels off at 5000 to 10000 rows
sqljam.export.page-size=5000
# Rows read per page of a table with LOB columns, which keeps memory low
sqljam.export.lob-page-size=100
# Max bytes of a data file before it is split (orders.sql, orders_2.sql ...), 10 MB
sqljam.export.max-file-size=10485760
# SINGLE_FILE (data.sql) or FILE_PER_TABLE (data/<table>.sql)
sqljam.export.data-file-strategy=SINGLE_FILE
# Write LOB values as files in lob/ instead of inline sql literals
sqljam.export.lob-separated=true
# INSERT statements per batch when importing an export package (Oracle: 100 statements per PL/SQL block).
# Measured: 2 to 10 times faster than statement by statement, 1 disables batches
sqljam.import.batch-size=1000
sqljam.export.last-directory=
sqljam.import.last-directory=

# Connection pool (HikariCP). Tables are copied one by one, a few connections are enough
sqljam.pool.maximum-size=10
sqljam.pool.minimum-idle=1
sqljam.pool.connection-timeout=30000
sqljam.pool.idle-timeout=300000
sqljam.pool.max-lifetime=1800000
