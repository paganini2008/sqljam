# Builds SqlJam. Database servers are not available here: the ci environment runs the integration tests of H2,
# SQLite and DuckDB only, the others are skipped.
#
#   check      pull requests and master: one Linux build with all tests, the check of merging
#   platforms  master, tags and manual runs: Windows, macOS and Linux build, start the runnable jar and take
#              screenshots, packages for download (src/packaging/package.sh); it does not hold up pull requests
#   release    tags v*: a GitHub release with the packages of every platform
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', 'change_logs/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'change_logs/**']
  workflow_dispatch:

# A newer commit of the same branch or pull request cancels the running build
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (UI tests run headless)
        run: ./mvnw -B -ntp verify -Dit.env=ci -Djacoco.haltOnFailure=false

  platforms:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac-aarch64
          # Intel Macs, jpackage builds for the architecture it runs on
          - os: macos-15-intel
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (UI tests run headless)
        shell: bash
        run: ./mvnw -B -ntp verify -Dit.env=ci -Djacoco.haltOnFailure=false

      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11-apps imagemagick libgtk-3-0

      - name: Start the runnable jar of the platform
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home" screenshots
          JAR=$(ls bin/sqljam-*-${{ matrix.platform }}.jar)
          OPTS="-Duser.home=$RUNNER_TEMP/home -Dsqljam.vmoptions.applied=true"
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            sleep 2
          fi
          java $OPTS -jar "$JAR" > run.log 2>&1 &
          PID=$!
          sleep 4
          # Splash screen, then the login page
          case "$RUNNER_OS" in
            Linux) xwd -root -silent | convert xwd:- screenshots/splash.png ;;
            macOS) screencapture -x screenshots/splash.png || true ;;
            Windows) powershell -File .github/workflows/screenshot.ps1 screenshots/splash.png || true ;;
          esac
          sleep 20
          case "$RUNNER_OS" in
            Linux) xwd -root -silent | convert xwd:- screenshots/login.png ;;
            macOS) screencapture -x screenshots/login.png || true ;;
            Windows) powershell -File .github/workflows/screenshot.ps1 screenshots/login.png || true ;;
          esac
          cat run.log
          kill $PID 2>/dev/null || taskkill //F //PID $PID 2>/dev/null || true
          grep -q ":: SqlJam ::" run.log
          if grep -E "Exception|ERROR" run.log; then exit 1; fi

      - name: Package for download
        shell: bash
        run: sh src/packaging/package.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqljam-${{ matrix.platform }}
          path: |
            screenshots/
            run.log
            bin/SqlJam-*
            bin/sqljam_*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "SqlJam $GITHUB_REF_NAME" \
            --generate-notes $(find artifacts -name 'SqlJam-*' -o -name 'sqljam_*.deb')
