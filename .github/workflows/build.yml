# Builds SqlJam and checks the user interface on Windows, macOS and Linux.
# Database integration tests need local databases, they are skipped here (H2 and SQLite run everywhere).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac-aarch64
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (UI tests run headless)
        shell: bash
        run: ./mvnw -B verify -Djacoco.haltOnFailure=false

      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11-apps imagemagick libgtk-3-0

      - name: Start the runnable jar of the platform
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home" screenshots
          JAR=$(ls bin/sqljam-*-${{ matrix.platform }}.jar)
          OPTS="-Duser.home=$RUNNER_TEMP/home -Dsqljam.vmoptions.applied=true"
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            sleep 2
          fi
          java $OPTS -jar "$JAR" > run.log 2>&1 &
          PID=$!
          sleep 4
          # Splash screen, then the login page
          case "$RUNNER_OS" in
            Linux) xwd -root -silent | convert xwd:- screenshots/splash.png ;;
            macOS) screencapture -x screenshots/splash.png || true ;;
            Windows) powershell -File .github/workflows/screenshot.ps1 screenshots/splash.png || true ;;
          esac
          sleep 20
          case "$RUNNER_OS" in
            Linux) xwd -root -silent | convert xwd:- screenshots/login.png ;;
            macOS) screencapture -x screenshots/login.png || true ;;
            Windows) powershell -File .github/workflows/screenshot.ps1 screenshots/login.png || true ;;
          esac
          cat run.log
          kill $PID 2>/dev/null || taskkill //F //PID $PID 2>/dev/null || true
          grep -q ":: SqlJam ::" run.log
          if grep -E "Exception|ERROR" run.log; then exit 1; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqljam-${{ matrix.platform }}
          path: |
            screenshots/
            run.log
            bin/sqljam-*-${{ matrix.platform }}.jar
