# Builds SqlJam. The ci environment runs the integration tests of H2, SQLite, DuckDB and Access, and of the main
# database servers where they run in Docker (.github/workflows/databases.sh), the others are skipped.
#
#   check      pull requests: one Linux build with all tests against PostgreSQL, MySQL, Oracle, SQL Server, Qdrant
#              and Weaviate in Docker, the check of merging
#   platforms  tags v* and manual runs (Actions > build > Run workflow): Windows, macOS and Linux build, start the
#              runnable jar and take screenshots, packages for download (src/packaging/package.sh)
#   release    tags v*: a GitHub release with the packages of every platform and their SHA-256 checksums
# Merging into master builds nothing, the pull request is checked already.
name: build

on:
  push:
    tags: ['v*']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'change_logs/**']
  workflow_dispatch:
    inputs:
      version:
        description: Version of the packages, e.g. 1.0.0 to try the msi installer (the version of pom.xml if empty)
        required: false

# A newer commit of the same branch or pull request cancels the running build
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The databases start while SqlJam is compiled
      - name: Build and test against the main databases (UI tests run headless)
        run: |
          bash .github/workflows/databases.sh > databases.log 2>&1 &
          DATABASES=$!
          ./mvnw -B -ntp test-compile
          wait $DATABASES || { cat databases.log; exit 1; }
          cat databases.log
          ./mvnw -B -ntp verify -Dit.env=ci -Djacoco.haltOnFailure=false

  platforms:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac-aarch64
          # Intel Macs, jpackage builds for the architecture it runs on
          - os: macos-15-intel
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (UI tests run headless)
        shell: bash
        run: ./mvnw -B -ntp verify -Dit.env=ci -Djacoco.haltOnFailure=false

      # rpmbuild of the rpm package
      - name: Install a virtual display and rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11-apps imagemagick libgtk-3-0 rpm

      - name: Start the runnable jar of the platform
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home" screenshots
          JAR=$(ls bin/sqljam-*-${{ matrix.platform }}.jar)
          OPTS="-Duser.home=$RUNNER_TEMP/home -Dsqljam.vmoptions.applied=true"
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            sleep 2
          fi
          java $OPTS -jar "$JAR" > run.log 2>&1 &
          PID=$!
          sleep 4
          # Splash screen, then the login page
          case "$RUNNER_OS" in
            Linux) xwd -root -silent | convert xwd:- screenshots/splash.png ;;
            macOS) screencapture -x screenshots/splash.png || true ;;
            Windows) powershell -File .github/workflows/screenshot.ps1 screenshots/splash.png || true ;;
          esac
          sleep 20
          case "$RUNNER_OS" in
            Linux) xwd -root -silent | convert xwd:- screenshots/main.png ;;
            macOS) screencapture -x screenshots/main.png || true ;;
            Windows) powershell -File .github/workflows/screenshot.ps1 screenshots/main.png || true ;;
          esac
          cat run.log
          kill $PID 2>/dev/null || taskkill //F //PID $PID 2>/dev/null || true
          grep -q ":: SqlJam ::" run.log
          if grep -E "Exception|ERROR" run.log; then exit 1; fi

      # jpackage builds the msi installer with the WiX Toolset 3, the binaries are used without installing them
      - name: Install the WiX Toolset for the msi installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP "wix"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile "$wix.zip"
          Expand-Archive -Path "$wix.zip" -DestinationPath $wix
          $wix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Packages of a tag are named by it (v1.0.0-rc1: SqlJam-1.0.0-rc1-...), of a manual run by its version input,
      # others by the version of pom.xml. Pre-releases have no msi installer.
      - name: Package for download
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;; esac
          sh src/packaging/package.sh ${{ matrix.platform }} $VERSION

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqljam-${{ matrix.platform }}
          path: |
            screenshots/
            run.log
            bin/SqlJam-*
            bin/sqljam_*.deb
            bin/sqljam-*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The packages of every platform in one directory with their SHA-256 checksums, verified by downloaders with
      # sha256sum -c SHA256SUMS.txt --ignore-missing (shasum -a 256 -c on macOS)
      - name: Collect the packages and their checksums
        run: |
          mkdir release
          find artifacts -type f \( -name 'SqlJam-*' -o -name 'sqljam_*.deb' -o -name 'sqljam-*.rpm' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix, e.g. v1.0.0-rc1 or v1.0.0-beta, is a pre-release, it is not the latest release
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "SqlJam $GITHUB_REF_NAME" \
            $PRERELEASE --generate-notes release/*
